<head>

          <!-- Kolom Kiri: Sidebar -->

                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px; font-weight: bold; cursor: pointer;">

  <!-- Taskbar -->

  <script src="supabase.config.js"></script>

  <script>
    /**
     * Toggles the visibility of project detail panes.
     * Hides all panes and removes the 'hidden' class from the selected project.
     * 
     * @param {string} projectId - The DOM ID of the project pane to display.
     */
    function showProject(projectId) {
      document.querySelectorAll('.project-view-pane').forEach(el => {
        el.classList.add('hidden');
      });

      const containerEl = document.querySelector('.explorer-container');
      if (containerEl) {
        if (projectId === 'proj-default') {
          containerEl.classList.remove('view-details');
        } else {
          containerEl.classList.add('view-details');
        }
      }

      const targetPane = document.getElementById(projectId);
      if (targetPane) {
        targetPane.classList.remove('hidden');
        targetPane.style.opacity = '0';
        targetPane.style.transition = 'opacity 0.2s ease-in-out';
        setTimeout(() => { targetPane.style.opacity = '1'; }, 10);
      }

      // Highlight selected tree node
      const treeEl = document.getElementById('projects-tree');
      if (treeEl) {
        treeEl.querySelectorAll('li').forEach(item => {
          if (item.getAttribute('data-proj-id') === projectId) {
            item.classList.add('selected-item');
          } else {
            item.classList.remove('selected-item');
          }
        });
      }
    }

    async function loadProjects() {
      try {
        let projects;
        const cached = sessionStorage.getItem('techcorner_projects_cache');
        if (cached) {
          projects = JSON.parse(cached);
        } else {
          const response = await fetch('data/projects.json');
          if (!response.ok) throw new Error('Network response was not ok');
          projects = await response.json();
          sessionStorage.setItem('techcorner_projects_cache', JSON.stringify(projects));
        }
        window.portfolioProjects = projects; // Save globally for PDF generator
        
        // Update footer project count dynamically
        const footerCountEl = document.getElementById('projects-count-text');
        if (footerCountEl) {
          footerCountEl.innerHTML = `<img src="assets/icon.webp" class="footer-mascot" alt="" loading="lazy" width="24" height="24">${projects.length} projects found`;
        }

        const treeEl = document.getElementById('projects-tree');
        const viewerEl = document.getElementById('project-viewer');
        const indexListEl = document.getElementById('index-projects-list');

        if (indexListEl) {
          indexListEl.innerHTML = '';
        }

        // Extract unique categories for folder creation
        const categories = [...new Set(projects.map(p => p.category))];

        categories.forEach(cat => {
          // Render category folder in sidebar
          const folder = document.createElement('li');
          folder.className = 'folder';
          folder.textContent = `📁 ${cat}`;
          folder.setAttribute('tabindex', '0');
          treeEl.appendChild(folder);

          // Add category section to index view
          if (indexListEl) {
            const catHeader = document.createElement('div');
            catHeader.style.fontWeight = 'bold';
            catHeader.style.marginTop = '8px';
            catHeader.innerHTML = `📁 ${cat}`;
            indexListEl.appendChild(catHeader);
          }

          const catProjects = projects.filter(p => p.category === cat);

          catProjects.forEach(p => {
            // Render project file item in sidebar
            const li = document.createElement('li');
            li.textContent = `📄 ${p.title}`;
            li.setAttribute('data-proj-id', p.id);
            li.setAttribute('tabindex', '0');
            li.onclick = () => showProject(p.id);
            li.onkeydown = (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                showProject(p.id);
              }
            };
            treeEl.appendChild(li);

            // Add project link to index view
            if (indexListEl) {
              const item = document.createElement('div');
              item.style.paddingLeft = '20px';
              item.style.cursor = 'pointer';
              item.style.color = 'var(--text-color, #000)';
              item.style.textDecoration = 'underline';
              item.setAttribute('tabindex', '0');
              item.innerHTML = `📄 <strong>${p.title}</strong> — <small>${p.role} (${p.year})</small>`;
              item.onclick = () => showProject(p.id);
              item.onkeydown = (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  showProject(p.id);
                }
              };
              indexListEl.appendChild(item);
            }

            // Construct project content pane
            const pane = document.createElement('div');
            pane.id = p.id;
            pane.className = 'project-view-pane hidden';

            // Build dynamic HTML segments
            const statusHtml = p.status
              ? `<div class="project-status-alert"><strong>Current Status:</strong> ${p.status}</div>`
              : '';

            const imgHtml = p.image
              ? `<div class="image-scroll-container"><img src="${p.image}" alt="${p.title}" loading="lazy" width="843" height="422"></div>`
              : '';

            const tagsHtml = p.tags.map(t => {
              if (t === 'ONGOING') return `<span class="project-tag-ongoing">${t}</span>`;
              if (p.category === 'Work In Progress') return `<span class="project-tag-wip">${t}</span>`;
              return `<span>${t}</span>`;
            }).join('');

            const linkHtml = p.link
              ? `<a href="${p.link}" target="_blank"><button type="button">${p.linkText}</button></a>`
              : `<button type="button" disabled style="${p.linkText.includes('looking') ? 'cursor: help;' : ''}">${p.linkText}</button>`;

            // Inject assembled HTML into pane
            pane.innerHTML = `
              <div style="margin: -24px -24px 16px -24px; padding: 8px 12px; border-bottom: 1px solid #ccc; background: #eaeaea; display: flex; align-items: center; gap: 8px;">
                <button onclick="showProject('proj-default')" style="cursor: pointer; padding: 3px 8px; display: inline-flex; align-items: center; gap: 4px;">
                  🔙 Back to Projects
                </button>
              </div>
              <div class="project-body">
                <div class="project-icon" ${p.category === 'Work In Progress' ? 'style="background: #fff3e6; border-color: #ffcc80;"' : ''}>${p.icon}</div>
                <div class="project-details">
                  <h3 style="margin-top: 0; font-size: 18px; ${p.category === 'Work In Progress' ? 'color: #cc7a00;' : ''}">${p.title}</h3>
                  <div class="project-meta-info">
                    <strong>Role:</strong> ${p.role} &nbsp;|&nbsp; <strong>Year:</strong> ${p.year}
                  </div>
                  ${imgHtml}
                  <p>${p.description}</p>
                  ${statusHtml}
                  <div class="project-tags">${tagsHtml}</div>
                  <div class="project-links">${linkHtml}</div>
                </div>
              </div>
            `;

            viewerEl.appendChild(pane);
          });
        });

      } catch (err) {
        console.error("Failed to load projects.json:", err);
      }
    }

    // Initialize projects on script load
    loadProjects();

    /**
    * Helper to load an image from a URL and convert it to base64 JPEG format.
    * jsPDF requires base64 to embed images natively.
    */
    function getBase64Image(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            
            // Constrain maximum resolution to 500px to optimize PDF file size
            const maxDim = 500;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            // Convert to PNG to preserve alpha channel transparency
            const dataURL = canvas.toDataURL('image/png');
            resolve({ dataURL, width: w, height: h });
          } catch (err) {
            reject(new Error("Canvas taint/conversion error: " + err.message));
          }
        };
        img.onerror = error => reject(new Error("Failed to load image resource: " + url));
        img.src = url;
      });
    }

    /**
     * Generates a PDF document from the loaded JSON data using jsPDF.
     * Implements "Jalur B" (Auto-generated PDF with embedded images).
     */
    async function generatePDF() {
      // Check if jsPDF library has loaded from CDN
      if (!window.jspdf) {
        alert("PDF Library is still loading. Please wait a moment and try again.");
        return;
      }

      const btn = document.getElementById('download-pdf-btn');
      const originalBtnHTML = btn.innerHTML;
      btn.innerHTML = `<span style="font-size: 16px;">⏳</span> Generating...`;
      btn.disabled = true;

      try {
        const { jsPDF } = window.jspdf;
        // Use Landscape ('l') orientation for a presentation-style layout
        const doc = new jsPDF({ orientation: "l", unit: "mm", format: "a4" });

        if (!window.portfolioProjects || window.portfolioProjects.length === 0) {
          throw new Error("No projects found to export!");
        }

        // Loop through all projects (1 Page = 1 Project constraint)
        for (let i = 0; i < window.portfolioProjects.length; i++) {
          const p = window.portfolioProjects[i];

          // Generate a new page for every subsequent project
          if (i > 0) {
            doc.addPage();
          }

          // 1. Cozy Parchment Background & Mountain Silhouette (using my-gallery header styles)
          const bgCanvas = document.createElement('canvas');
          bgCanvas.width = 800;
          bgCanvas.height = 566;
          const bgCtx = bgCanvas.getContext('2d');
          
          // Auto-scale context to draw original coordinates on a smaller footprint
          bgCtx.scale(800 / 1440, 566 / 1018);

          // Fill background color
          bgCtx.fillStyle = '#F4EAE0';
          bgCtx.fillRect(0, 0, 1440, 1018);

          // Draw Back Mountain (#EADBC8)
          bgCtx.fillStyle = '#EADBC8';
          bgCtx.beginPath();
          bgCtx.moveTo(0, 1018);
          bgCtx.lineTo(250, 1018 - (250 - 80) * 0.96);
          bgCtx.lineTo(510, 1018 - (250 - 190) * 0.96);
          bgCtx.lineTo(850, 1018 - (250 - 40) * 0.96);
          bgCtx.lineTo(1180, 1018 - (250 - 210) * 0.96);
          bgCtx.lineTo(1440, 1018 - (250 - 100) * 0.96);
          bgCtx.lineTo(1440, 1018);
          bgCtx.closePath();
          bgCtx.fill();

          // Draw Front Mountain (#DAC0A3)
          bgCtx.fillStyle = '#DAC0A3';
          bgCtx.beginPath();
          bgCtx.moveTo(0, 1018);
          bgCtx.lineTo(180, 1018 - (250 - 150) * 0.96);
          bgCtx.lineTo(420, 1018 - (250 - 220) * 0.96);
          bgCtx.lineTo(680, 1018 - (250 - 120) * 0.96);
          bgCtx.lineTo(1020, 1018 - (250 - 200) * 0.96);
          bgCtx.lineTo(1290, 1018 - (250 - 130) * 0.96);
          bgCtx.lineTo(1440, 1018 - (250 - 180) * 0.96);
          bgCtx.lineTo(1440, 1018);
          bgCtx.closePath();
          bgCtx.fill();

          // Convert background to JPEG with 0.6 quality (takes much less space than PNG)
          const bgDataURL = bgCanvas.toDataURL('image/jpeg', 0.6);
          doc.addImage(bgDataURL, 'JPEG', 0, 0, 297, 210);


          // 2. Notebook horizontal grid lines
          doc.setDrawColor(240, 230, 210); // #F0E6D2
          doc.setLineWidth(0.25);
          for (let lineY = 24; lineY < 192; lineY += 7) {
            doc.line(20, lineY, 285, lineY);
          }

          // 3. Notebook Margin Red Line
          doc.setDrawColor(224, 90, 71); // #E05A47
          doc.setLineWidth(0.4);
          doc.line(26, 0, 26, 210);

          // 4. Spiral Binder Rings on Left Border
          for (let ringY = 12; ringY < 200; ringY += 14) {
            // Metallic silver ring loop
            doc.setDrawColor(180, 190, 200);
            doc.setLineWidth(1.2);
            doc.line(4, ringY, 11, ringY);

            // Punch holes
            doc.setFillColor(45, 58, 58); // Forest/Charcoal
            doc.circle(4, ringY, 0.7, "F");
            doc.circle(11, ringY, 0.7, "F");
          }

          // 5. Retro Postage Category Stamp (Top Right)
          doc.setFillColor(255, 255, 255);
          doc.setDrawColor(45, 58, 58);
          doc.setLineWidth(0.5);
          doc.rect(225, 8, 58, 14, "FD");
          // Stamp inner border decoration
          doc.setDrawColor(230, 161, 92); // Sun gold
          doc.setLineWidth(0.25);
          doc.rect(227, 9.5, 54, 11);

          doc.setFontSize(8);
          doc.setTextColor(45, 58, 58);
          doc.text(`YEAR: ${p.year}`, 230, 13);
          const shortCat = p.category.length > 20 ? p.category.substring(0, 18) + '...' : p.category;
          doc.text(`CAT: ${shortCat.toUpperCase()}`, 230, 17);

          // 6. Project Title (Brutalist style)
          doc.setFontSize(22);
          doc.setTextColor(224, 90, 71); // Campfire Orange
          doc.text(`${p.title}`, 32, 18);

          let leftY = 28;

          // Role info
          doc.setFontSize(10);
          doc.setTextColor(45, 93, 78); // Deep Pine Green
          doc.text(`Operational Role: ${p.role}`, 32, leftY);
          leftY += 5;

          // Decorative separator line (dashed)
          doc.setDrawColor(45, 58, 58);
          doc.setLineWidth(0.3);
          doc.setLineDashPattern([2, 2], 0);
          doc.line(32, leftY, 283, leftY);
          doc.setLineDashPattern([], 0); // reset dash pattern
          leftY += 8;

          // 7. Responsive Text Block width calculation
          const textColumnWidth = p.image ? 100 : 240;

          // Project Description
          doc.setFontSize(11);
          doc.setTextColor(45, 58, 58); // Charcoal
          const descLines = doc.splitTextToSize(p.description, textColumnWidth);
          doc.text(descLines, 32, leftY);
          leftY += (descLines.length * 5.5) + 6;

          // Publication Link
          if (p.link) {
            doc.setFontSize(10);
            doc.setTextColor(224, 90, 71); // Campfire Orange
            const linkText = `Link: ${p.link}`;
            const targetWidth = p.image ? 100 : 240;
            let shortLink = linkText;
            if (doc.getTextWidth(shortLink) > targetWidth) {
              while (shortLink.length > 0 && doc.getTextWidth(shortLink + "...") > targetWidth) {
                shortLink = shortLink.substring(0, shortLink.length - 1);
              }
              shortLink += "...";
            }
            doc.textWithLink(shortLink, 32, leftY, { url: p.link });
            // Underline
            const textWidth = doc.getTextWidth(shortLink);
            doc.setDrawColor(224, 90, 71);
            doc.setLineWidth(0.25);
            doc.line(32, leftY + 1, 32 + textWidth, leftY + 1);
            leftY += 8;
          }

          // Special status notes (ongoing etc)
          if (p.status) {
            doc.setFontSize(10);
            doc.setTextColor(230, 161, 92); // Warm Gold
            const statusLines = doc.splitTextToSize(`Status: ${p.status}`, textColumnWidth);
            doc.text(statusLines, 32, leftY);
            leftY += (statusLines.length * 5) + 8;
          }

          // 8. Neo-Brutalist rectangular tag badges
          if (p.tags && p.tags.length > 0) {
            let tagX = 32;
            p.tags.forEach(t => {
              const tWidth = doc.getTextWidth(t);
              const badgeW = tWidth + 6;
              const badgeH = 6;

              // Flat offset shadow
              doc.setFillColor(45, 58, 58);
              doc.rect(tagX + 1, leftY + 1, badgeW, badgeH, "F");

              // Badge container
              if (t === 'ONGOING' || p.category === 'Work In Progress') {
                doc.setFillColor(255, 235, 204); // gold tint
              } else {
                doc.setFillColor(255, 255, 255); // white
              }
              doc.setDrawColor(45, 58, 58);
              doc.setLineWidth(0.4);
              doc.rect(tagX, leftY, badgeW, badgeH, "FD");

              // Badge text
              doc.setFontSize(8);
              doc.setTextColor(45, 58, 58);
              doc.text(t, tagX + 3, leftY + 4.3);

              tagX += badgeW + 4;
            });
          }

          // 9. Polaroid Screenshot layout on the right column
          if (p.image) {
            try {
              const imgData = await getBase64Image(p.image);

              // Max area width X=145 to 283 leaves ~138mm.
              let imgW = 120;
              let imgH = (imgData.height * imgW) / imgData.width;

              // Constrain max height
              if (imgH > 115) {
                imgH = 115;
                imgW = (imgData.width * imgH) / imgData.height;
              }

              // Center in the right side area
              const xPos = 145 + ((130 - imgW) / 2);
              const yPos = 35;

              // 9a. Draw Flat Hard Shadow of Polaroid card (brutalist offset)
              doc.setFillColor(45, 58, 58);
              doc.rect(xPos - 4.5 + 2.5, yPos - 4.5 + 2.5, imgW + 9, imgH + 18, "F");

              // 9b. Draw White Polaroid Card Container
              doc.setFillColor(255, 255, 255);
              doc.setDrawColor(45, 58, 58);
              doc.setLineWidth(0.5);
              doc.rect(xPos - 4.5, yPos - 4.5, imgW + 9, imgH + 18, "FD");

              // 9c. Render Project image on top (using PNG to preserve transparency)
              doc.addImage(imgData.dataURL, 'PNG', xPos, yPos, imgW, imgH);

              // 9d. Draw a tilted Washi Tape sticker on top
              const tapeW = 26;
              const tapeH = 6;
              const tapeX = xPos + imgW / 2 - tapeW / 2;
              const tapeY = yPos - 7;

              // Tilted rectangle drawn as polygon coordinates
              doc.setFillColor(230, 161, 92); // Gold tape
              doc.triangle(tapeX, tapeY + 1, tapeX + tapeW, tapeY - 1, tapeX + tapeW, tapeY + tapeH - 1, "F");
              doc.triangle(tapeX, tapeY + 1, tapeX, tapeY + tapeH + 1, tapeX + tapeW, tapeY + tapeH - 1, "F");
              // Tape dashed edges
              doc.setDrawColor(45, 58, 58);
              doc.setLineWidth(0.2);
              doc.line(tapeX, tapeY + 1, tapeX, tapeY + tapeH + 1);
              doc.line(tapeX + tapeW, tapeY - 1, tapeX + tapeW, tapeY + tapeH - 1);
            } catch (err) {
              console.warn("Could not load image for PDF:", p.image, err);
            }
          }

          // ==========================================
          // PDF PAGE FOOTER (Scrapbook style)
          // ==========================================

          // Separator dotted line
          doc.setDrawColor(45, 58, 58);
          doc.setLineWidth(0.3);
          doc.setLineDashPattern([2, 2], 0);
          doc.line(32, 194, 283, 194);
          doc.setLineDashPattern([], 0); // reset

          // Footer info
          doc.setFontSize(8);
          doc.setTextColor(45, 58, 58);
          doc.text("Compiled by Bilgrandov's Tech Corner Portfolio Project Scrapbook", 32, 201);
          doc.text(`PAGE ${i + 1} OF ${window.portfolioProjects.length}`, 262, 201);
        }

        // Trigger file download
        doc.save("Bilgrandov_Cozy_Scrapbook_Deck.pdf");

      } catch (err) {
        console.error(err);
        alert(err.message || "Failed to generate PDF.");
      } finally {
        btn.innerHTML = originalBtnHTML;
        btn.disabled = false;
      }
    }

    // Attach event listener to our new button
    document.getElementById('download-pdf-btn').addEventListener('click', generatePDF);
  </script>

</body>
