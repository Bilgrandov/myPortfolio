<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bilgrandov's Tech Corner — My Projects">
  <meta name="theme-color" content="#245edb">
  <title>★ Bilgrandov's Tech Corner ★ ~ Projects</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Kosugi+Maru&display=swap">
  <link rel="stylesheet" href="assets/xp.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="crt-overlay"></div>
  <img src="assets/work_sticker.webp" class="work-badge" alt="Open to Work" width="130" height="130" loading="lazy">
  <canvas id="sparkle-canvas" aria-hidden="true"></canvas>

  <main class="page-container">
    <div class="window main-window">
      <div class="title-bar">
        <div class="title-bar-text">📁 My Projects — C:\Projects</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
      <div class="window-body" style="padding: 0;">
        <div class="explorer-container">
          <!-- Kolom Kiri: Sidebar -->
          <div class="explorer-sidebar">
            <div class="tree-container">
              <ul class="tree-view" id="projects-tree">

              </ul>
            </div>
          </div>

          <!-- Kolom Kanan: Viewer -->
          <div class="explorer-content" id="project-viewer">

            <!-- Tampilan Awal (Belum ada yang diklik) -->
            <div id="proj-default" class="project-view-pane">
              <h2 style="color: #666; text-align: center; margin-top: 50px;">👈 Pilih file proyek di sebelah kiri untuk
                melihat detailnya...</h2>
            </div>

            <!-- Wadah Konten Proyek (Kita isi di Langkah 2) -->


          </div>
        </div>
      </div>
      <div class="window-footer">
        <span><img src="assets/profile.jpg" class="footer-mascot" alt="" loading="lazy" width="24" height="24">2
          projects found</span>
        <span>～ more coming soon! ～</span>
      </div>
    </div>
  </main>

  <!-- Taskbar -->
  <nav class="taskbar">
    <button class="start-btn" type="button">
      <span class="start-icon">🪟</span> Start
    </button>
    <div class="taskbar-divider"></div>
    <div class="taskbar-links">
      <a href="index.html" class="taskbar-link"><span class="link-icon">🏠</span> <span>Home</span></a>
      <a href="skills.html" class="taskbar-link"><span class="link-icon">⚡</span> <span>Skills</span></a>
      <a href="projects.html" class="taskbar-link active"><span class="link-icon">📁</span> <span>Projects</span></a>
      <a href="posts.html" class="taskbar-link"><span class="link-icon">📝</span> <span>Posts</span></a>
      <a href="contact.html" class="taskbar-link"><span class="link-icon">💌</span> <span>Contact</span></a>
    </div>
    <button id="theme-switcher" class="theme-switcher-btn" title="Switch Theme">💿</button>
    <div class="taskbar-clock" id="taskbar-clock">12:00</div>
  </nav>

  <script src="script.js" defer></script>
  <script>
    /**
     * Toggles the visibility of project detail panes.
     * Hides all panes and removes the 'hidden' class from the selected project.
     * 
     * @param {string} projectId - The DOM ID of the project pane to display.
     */
    function showProject(projectId) {
      document.querySelectorAll('.project-view-pane').forEach(el => {
        el.classList.add('hidden');
      });
      document.getElementById(projectId).classList.remove('hidden');
    }

    /**
     * Fetches project data from JSON and dynamically constructs the file explorer UI.
     * Generates both the sidebar navigation tree and the main content panes.
     */
    async function loadProjects() {
      try {
        const response = await fetch('data/projects.json');
        if (!response.ok) throw new Error('Network response was not ok');
        const projects = await response.json();
        
        const treeEl = document.getElementById('projects-tree');
        const viewerEl = document.getElementById('project-viewer');
        
        // Extract unique categories for folder creation
        const categories = [...new Set(projects.map(p => p.category))];
        
        categories.forEach(cat => {
          // Render category folder in sidebar
          const folder = document.createElement('li');
          folder.className = 'folder';
          folder.textContent = `📁 ${cat}`;
          treeEl.appendChild(folder);
          
          const catProjects = projects.filter(p => p.category === cat);
          
          catProjects.forEach(p => {
            // Render project file item in sidebar
            const li = document.createElement('li');
            li.textContent = `📄 ${p.title}`;
            li.onclick = () => showProject(p.id);
            treeEl.appendChild(li);
            
            // Construct project content pane
            const pane = document.createElement('div');
            pane.id = p.id;
            pane.className = 'project-view-pane hidden';
            
            // Build dynamic HTML segments
            const statusHtml = p.status 
              ? `<p style="padding: 8px; background: #fff5e6; border-left: 3px solid #e68a00; font-size: 13px; margin: 10px 0;"><strong>Current Status:</strong> ${p.status}</p>` 
              : '';
            
            const imgHtml = p.image 
              ? `<div class="image-scroll-container"><img src="${p.image}" alt="${p.title}" loading="lazy" width="843" height="422"></div>` 
              : '';
            
            const tagsHtml = p.tags.map(t => {
              if (t === 'ONGOING') return `<span style="background: #ffcccc; border-color: #ff6666; color: #cc0000; font-weight: bold;">${t}</span>`;
              if (p.category === 'Work In Progress') return `<span style="background: #fff3e6; border-color: #ffcc80; color: #cc7a00;">${t}</span>`;
              return `<span>${t}</span>`;
            }).join('');
            
            const linkHtml = p.link 
              ? `<a href="${p.link}" target="_blank"><button type="button">${p.linkText}</button></a>`
              : `<button type="button" disabled style="${p.linkText.includes('looking') ? 'cursor: help;' : ''}">${p.linkText}</button>`;

            // Inject assembled HTML into pane
            pane.innerHTML = `
              <div class="project-body">
                <div class="project-icon" ${p.category === 'Work In Progress' ? 'style="background: #fff3e6; border-color: #ffcc80;"' : ''}>${p.icon}</div>
                <div class="project-details">
                  <h3 style="margin-top: 0; font-size: 18px; ${p.category === 'Work In Progress' ? 'color: #cc7a00;' : ''}">${p.title}</h3>
                  ${imgHtml}
                  <p>${p.description}</p>
                  ${statusHtml}
                  <div class="project-tags">${tagsHtml}</div>
                  <div class="project-links">${linkHtml}</div>
                </div>
              </div>
            `;
            
            viewerEl.appendChild(pane);
          });
        });
        
      } catch (err) {
        console.error("Failed to load projects.json:", err);
      }
    }

    // Initialize projects on script load
    loadProjects();
  </script>

</body>

</html>
