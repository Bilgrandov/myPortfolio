<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Soft dot grid pattern -->
    <pattern id="dotgrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#8ab4d4" fill-opacity="0.35"/>
    </pattern>
    <!-- Very subtle top vignette gradient -->
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ccdff0; stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ddeaf7; stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Base: warm soft blue-white -->
  <rect width="100%" height="100%" fill="#dce9f5"/>
  <!-- Dot grid overlay -->
  <rect width="100%" height="100%" fill="url(#dotgrid)"/>
  <!-- Soft vignette at top to add depth -->
  <rect width="100%" height="60%" fill="url(#vignette)"/>
</svg>
