<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Subtle dot grid for dark mode -->
    <pattern id="dotgrid-dark" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#2a4060" fill-opacity="0.7"/>
    </pattern>
    <!-- Faint glow at top-left, gives depth without being distracting -->
    <radialGradient id="glow" cx="20%" cy="15%" r="55%">
      <stop offset="0%" style="stop-color:#1a3a5c; stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0a111e; stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- Base: deep dark navy -->
  <rect width="100%" height="100%" fill="#0d1520"/>
  <!-- Dot grid overlay -->
  <rect width="100%" height="100%" fill="url(#dotgrid-dark)"/>
  <!-- Subtle ambient glow -->
  <rect width="100%" height="100%" fill="url(#glow)"/>
</svg>
